version: "3"

# Local deploy is the chosen path (the GitHub Actions deploy job stays off unless
# CF_CI_DEPLOY is set). Config comes from the 1Password Environment `crowd-media-deploy`,
# mounted by the 1Password app at ./.env (gitignored; a pipe the app serves, not a file
# with values on disk). CLOUDFLARE_API_TOKEN there is an `op://` reference, not a value;
# `op run --env-file=.env` resolves it for the deploy, so the token exists only inside
# that process. If `.env` is missing, open 1Password → Developer → Environments →
# crowd-media-deploy → mount it here.

dotenv: [".env"]

vars:
  WORKER_URL: https://crowd-media.matpataki.workers.dev

tasks:
  dev:
    desc: Run the Worker + assets locally with wrangler (no Cloudflare login needed)
    deps: [build-page]
    cmds:
      - npx wrangler dev

  types:
    desc: Regenerate worker-configuration.d.ts from wrangler.jsonc (commit the result)
    cmds:
      - npx wrangler types

  config:
    desc: Validate bands.yaml and compile it to src/config/generated.json (commit both)
    cmds:
      - node scripts/build-config.ts bands.yaml src/config/generated.json

  check:
    desc: Typecheck (tsc --noEmit; the page has its own browser tsconfig)
    deps: [config, build-page]
    cmds:
      - npx tsc --noEmit
      - npx tsc --noEmit -p src/page

  test:
    desc: Run the vitest suite inside the Workers runtime
    deps: [config, build-page]
    cmds:
      - npx vitest run

  deploy:
    desc: Deploy the Worker, then smoke-check the deployed health route
    deps: [config]
    cmds:
      - op run --env-file=.env -- npx wrangler deploy
      - scripts/smoke-deployed.sh {{.WORKER_URL}}/api/health

  build-page:
    desc: Bundle src/page/main.ts → public/app.js (committed; rebuild after page edits)
    cmds:
      - node scripts/build-page.mjs

  page:mock:
    desc: Serve the page against an in-memory mock API on http://127.0.0.1:8788 (dev only)
    deps: [build-page]
    cmds:
      - node scripts/mock-api.mjs --port 8788
